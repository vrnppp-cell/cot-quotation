<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>COT Quotation</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --forest:#354B47;--dforest:#1F2E2A;--forest2:#2A3C38;
  --gold:#C9C79C;--gold2:#A8A67A;--brown:#2A241E;
  --bg:#F5F5F3;--card:#fff;--card2:#F8F8F6;
  --text:#111311;--muted:#6B7070;--hint:#A8ADA8;
  --border:#DDE0DC;--border2:#C8CEC8;
  --green:#1B7A45;--green-bg:#EAF5EE;--green-bd:#A8D8BC;
  --amber:#8A5C00;--amber-bg:#FAF5E0;--amber-bd:#E0C870;
  --red:#B01020;--red-bg:#FDECEA;--red-bd:#F0A8A8;
  --blue:#1A5CB8;--blue-bg:#EEF3FD;--blue-bd:#B8D0F5;
  --purple:#6B3AAA;--purple-bg:#F3EEFF;--purple-bd:#C8AAEE;
  --r:10px;--rsm:6px;--rxs:4px;
  --sh:0 1px 3px rgba(17,19,17,.07);--shmd:0 4px 16px rgba(17,19,17,.10);
}
[data-theme=dark]{
  --bg:#181A1B;--card:#1F2326;--card2:#252A2C;
  --text:#E8E6E3;--muted:#8A9090;--hint:#555D5D;
  --border:#2E3538;--border2:#3A4245;
  --sh:0 1px 3px rgba(0,0,0,.3);--shmd:0 4px 16px rgba(0,0,0,.4);
  --forest:#3D5A54;--dforest:#253730;--gold:#B8B680;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;min-height:100vh;transition:background .2s,color .2s}

/* SETUP */
#setup{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--dforest);padding:2rem}
.scard{background:var(--card);border-radius:16px;padding:2.5rem;max-width:440px;width:100%;box-shadow:var(--shmd)}
.slogo{font-family:'IBM Plex Sans Thai',sans-serif;font-size:22px;font-weight:600;color:var(--forest);display:flex;align-items:center;gap:10px;margin-bottom:.5rem}
.slogo-icon{width:36px;height:36px;background:var(--forest);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
.ssub{color:var(--muted);font-size:13px;margin-bottom:1.5rem}
.sf{margin-bottom:12px}
.sf label{display:block;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.3px;text-transform:uppercase;margin-bottom:4px}
.sf input{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--rsm);font-size:13px;font-family:'Sarabun',sans-serif;background:var(--card);color:var(--text);outline:none;transition:border-color .15s}
.sf input:focus{border-color:var(--forest)}
.sbtn{width:100%;padding:11px;background:var(--forest);color:#fff;border:none;border-radius:var(--rsm);font-size:14px;font-weight:500;font-family:'Sarabun',sans-serif;cursor:pointer;margin-top:.5rem}
.sbtn:hover{background:var(--dforest)}
.serr{color:var(--red);font-size:12px;margin-top:6px;display:none}
.snote{font-size:11px;color:var(--hint);text-align:center;margin-top:8px}
.spinner{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* APP */
#app{display:none;flex-direction:column;min-height:100vh}
.topbar{background:var(--forest);padding:0 1.25rem;display:flex;align-items:center;gap:10px;min-height:52px;position:sticky;top:0;z-index:50}
.tlogo{font-family:'IBM Plex Sans Thai',sans-serif;font-size:15px;font-weight:600;color:#fff;display:flex;align-items:center;gap:7px;flex-shrink:0}
.tlogo-dot{width:7px;height:7px;border-radius:50%;background:var(--gold)}
.tnav{display:flex;gap:4px;flex:1}
.tnavbtn{padding:5px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.2);font-size:12px;font-weight:500;font-family:'Sarabun',sans-serif;cursor:pointer;background:transparent;color:rgba(255,255,255,.65);transition:all .15s}
.tnavbtn:hover{background:rgba(255,255,255,.1);color:#fff}
.tnavbtn.active{background:#fff;color:var(--forest);border-color:#fff}
.tright{display:flex;align-items:center;gap:8px}
.sdot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2)}
.sdot.ok{background:#4ADE80}.sdot.err{background:#FF6B6B}
.topbtn{padding:5px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.2);font-size:12px;font-weight:500;font-family:'Sarabun',sans-serif;cursor:pointer;background:rgba(255,255,255,.1);color:#fff;transition:all .15s}
.topbtn:hover{background:rgba(255,255,255,.2)}
.topbtn.gold{background:var(--gold);color:var(--brown);border-color:var(--gold)}
.theme-toggle{padding:4px 8px;border-radius:20px;border:1px solid rgba(255,255,255,.2);background:transparent;color:rgba(255,255,255,.7);cursor:pointer;font-size:14px}
.theme-toggle:hover{background:rgba(255,255,255,.1)}

/* BUTTONS */
.btn{padding:6px 14px;border-radius:var(--rsm);border:1.5px solid var(--border);font-size:12px;font-weight:500;font-family:'Sarabun',sans-serif;cursor:pointer;background:var(--card);color:var(--text);display:inline-flex;align-items:center;gap:5px;transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--forest);color:#fff;border-color:var(--forest)}.btn.primary:hover{background:var(--dforest)}
.btn.gold{background:var(--gold);color:var(--brown);border-color:var(--gold)}.btn.gold:hover{background:var(--gold2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}.btn.ghost:hover{background:var(--bg);color:var(--text)}
.btn.danger{color:var(--red);border-color:transparent}.btn.danger:hover{background:var(--red-bg)}
.btn.sm{padding:3px 9px;font-size:11px}
.btn.purple{background:var(--purple-bg);color:var(--purple);border-color:var(--purple-bd)}

/* PAGES */
.page{display:none;flex:1}.page.active{display:flex}

/* LAYOUT */
.qt-layout{display:grid;grid-template-columns:210px 1fr;flex:1;min-height:0}
.sidebar{background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;padding:.625rem}
.sb-label{font-size:10px;font-weight:600;color:var(--hint);text-transform:uppercase;letter-spacing:.5px;padding:4px 6px;margin-top:.5rem}
.sb-item{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:var(--rsm);font-size:12px;color:var(--muted);cursor:pointer;transition:all .15s;margin-bottom:1px;flex-wrap:wrap}
.sb-item:hover{background:var(--bg);color:var(--text)}
.sb-item.active{background:#EAF0EE;color:var(--forest);font-weight:500}
.sb-dot{width:6px;height:6px;border-radius:50%;background:var(--forest);flex-shrink:0}
.sb-meta{font-size:10px;color:var(--hint);margin-left:auto}
.sb-note{font-size:10px;color:var(--hint);width:100%;padding-left:13px}
.sb-divider{height:1px;background:var(--border);margin:.5rem 0}
.dashed-btn{width:100%;padding:5px 8px;border:1px dashed var(--border2);border-radius:var(--rsm);font-size:11px;color:var(--hint);background:transparent;cursor:pointer;text-align:center;margin-top:4px;font-family:'Sarabun',sans-serif}
.dashed-btn:hover{border-color:var(--forest);color:var(--forest)}

/* QT MAIN */
.qt-main{display:flex;flex-direction:column;overflow-y:auto;padding:1rem;gap:.75rem}
.qt-header-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1rem;box-shadow:var(--sh)}
.qt-title-row{display:flex;align-items:center;gap:8px;margin-bottom:.75rem;flex-wrap:wrap}
.qt-name-inp{font-size:14px;font-weight:500;color:var(--text);border:1px solid transparent;background:transparent;outline:none;flex:1;font-family:'Sarabun',sans-serif;padding:3px 6px;border-radius:4px;min-width:120px}
.qt-name-inp:hover{border-color:var(--border);background:var(--bg)}
.qt-name-inp:focus{border-color:var(--forest);background:var(--card)}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:2px 8px;border-radius:4px;font-weight:500}
.chip.ver{background:#EAF0EE;color:var(--forest);border:1px solid var(--green-bd)}
.chip.preset-chip{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bd)}
.chip.cot-chip{background:var(--purple-bg);color:var(--purple);border:1px solid var(--purple-bd)}
.chip.inhouse{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd)}
.chip.outsource{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bd)}
.view-toggle{display:flex;gap:3px;margin-left:auto}
.vtog{padding:4px 10px;border-radius:5px;font-size:11px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-family:'Sarabun',sans-serif;transition:all .15s}
.vtog.active{background:var(--forest);color:#fff;border-color:var(--forest)}
.qt-fields{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:.75rem}
.qf label{display:block;font-size:10px;color:var(--hint);font-weight:600;letter-spacing:.3px;text-transform:uppercase;margin-bottom:3px}
.qf input,.qf select,.qf textarea{width:100%;padding:6px 8px;border:1.5px solid var(--border);border-radius:var(--rxs);font-size:12px;font-family:'Sarabun',sans-serif;background:var(--card);color:var(--text);outline:none;transition:border-color .15s}
.qf input:focus,.qf select:focus,.qf textarea:focus{border-color:var(--forest)}
.qt-settings{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qt-set-num{width:52px;padding:4px 6px;border:1.5px solid var(--border);border-radius:var(--rxs);font-size:12px;font-family:'Sarabun',sans-serif;background:var(--card);color:var(--text);outline:none;text-align:center}
.qt-set-num:focus{border-color:var(--forest)}
.tpill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;border:1px solid var(--border);cursor:pointer;font-size:11px;font-weight:500;transition:all .15s;color:var(--muted);background:var(--card);font-family:'Sarabun',sans-serif}
.tpill.on{background:#EAF0EE;color:var(--forest);border-color:var(--green-bd)}
.remark-wrap{margin-top:.625rem;padding-top:.625rem;border-top:1px solid var(--border)}
.remark-wrap label{display:block;font-size:10px;color:var(--hint);font-weight:600;letter-spacing:.3px;text-transform:uppercase;margin-bottom:4px}
.remark-wrap textarea{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:var(--rxs);font-size:12px;font-family:'Sarabun',sans-serif;background:var(--card);color:var(--text);outline:none;resize:vertical;min-height:72px;line-height:1.6}
.remark-wrap textarea:focus{border-color:var(--forest)}

/* SECTION */
.section-block{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.section-head{display:flex;align-items:center;gap:8px;padding:9px 14px;cursor:pointer;user-select:none}
.sh-pre{background:var(--forest)}.sh-pro{background:var(--dforest)}.sh-post{background:var(--forest2)}.sh-extra{background:#5A4A2A}
.sh-title{color:var(--gold);font-size:12px;font-weight:500;letter-spacing:.3px;flex:1}
.sh-total{color:#fff;font-size:13px;font-weight:600}
.sh-cost{color:rgba(255,255,255,.5);font-size:11px;margin-left:6px}
.sh-chev{color:rgba(255,255,255,.5);transition:transform .2s;font-size:13px}
.sh-chev.open{transform:rotate(180deg)}

/* ITEM TABLE — inline editable */
.it-head{display:grid;padding:6px 10px;background:var(--card2);border-bottom:1px solid var(--border);font-size:10px;font-weight:600;color:var(--hint);text-transform:uppercase;letter-spacing:.3px;align-items:center}
.it-row{display:grid;padding:6px 10px;border-bottom:1px solid var(--border);font-size:12px;align-items:start;transition:background .1s;gap:4px}
.it-row:hover{background:var(--bg)}
.it-row.cot-row{border-left:3px solid var(--purple)}
/* internal cols: role+name | person | inout | qty | cost | price | mk | total | actions */
.g-int{grid-template-columns:1.8fr 1fr 42px 72px 78px 44px 68px 128px}
.g-cli{grid-template-columns:2fr 1fr 55px 85px 75px}
.it-cell{display:flex;flex-direction:column;gap:1px}
/* inline editable field */
.ie{background:transparent;border:1px solid transparent;border-radius:3px;font-size:12px;font-family:'Sarabun',sans-serif;color:var(--text);outline:none;width:100%;padding:2px 4px;cursor:text}
.ie:hover{border-color:var(--border2);background:var(--card)}
.ie:focus{border-color:var(--forest);background:var(--card);cursor:auto}
.ie.num{text-align:right}
.ie.sm-txt{font-size:11px;color:var(--muted)}
.ie.role-txt{font-size:11px;color:var(--hint);font-weight:500}
.ie.mk{width:42px;text-align:center;color:var(--forest)}
.it-cost-txt{color:var(--amber);font-weight:500;text-align:right;font-size:12px}
.it-total-txt{color:var(--text);font-weight:600;text-align:right;font-size:12px}
.it-actions{display:flex;gap:2px;justify-content:flex-end;align-items:center}
.io-toggle{display:inline-flex;border-radius:4px;overflow:hidden;border:1px solid var(--border);font-size:10px;height:22px}
.io-opt{padding:0 6px;cursor:pointer;display:flex;align-items:center;background:var(--card);color:var(--muted);transition:all .15s;font-family:'Sarabun',sans-serif;border:none;font-size:10px}
.io-opt.active-in{background:var(--green-bg);color:var(--green)}
.io-opt.active-out{background:var(--amber-bg);color:var(--amber)}
.add-row{display:flex;align-items:center;gap:6px;padding:7px 14px;border-top:1px solid var(--border);background:var(--card2);font-size:12px;color:var(--hint);cursor:pointer}
.add-row:hover{background:var(--bg);color:var(--forest)}
.mgmt-bar{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:8px 14px;display:flex;align-items:center;font-size:12px;box-shadow:var(--sh)}
.mgmt-label{color:var(--muted);flex:1}
.mgmt-val{font-weight:600;color:var(--text)}
.mgmt-cost{color:var(--amber);font-size:11px;margin-left:6px}

/* SUMMARY */
.sum-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1rem;box-shadow:var(--sh)}
.sum-top{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:.875rem;padding-bottom:.875rem;border-bottom:1px solid var(--border)}
.sum-box{text-align:right}
.sum-lbl{font-size:10px;color:var(--hint);text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px}
.sum-val{font-size:17px;font-weight:600;font-family:'IBM Plex Sans Thai',sans-serif}
.sum-grid{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:12px;margin-bottom:.75rem}
.slabel{color:var(--muted)}
.sval{text-align:right;font-weight:500;font-family:'IBM Plex Sans Thai',sans-serif}
.sval.red{color:var(--red)}
.sdiv{grid-column:1/-1;height:1px;background:var(--border);margin:4px 0}
.stotal-label{font-size:14px;font-weight:600}
.stotal-val{font-size:17px;font-weight:600;color:var(--forest);text-align:right;font-family:'IBM Plex Sans Thai',sans-serif}
.sum-footer{display:flex;align-items:flex-start;gap:10px;margin-top:.875rem;padding-top:.75rem;border-top:1px solid var(--border)}
.sum-actions-left{display:flex;gap:6px;flex-wrap:wrap}
.sum-actions-right{display:flex;gap:6px;margin-left:auto}

/* CATALOGUE */
.cat-page{flex:1;display:flex;flex-direction:column;padding:1rem}
.cat-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:.75rem;flex-wrap:wrap}
.cat-fb{padding:4px 12px;border-radius:20px;border:1px solid var(--border);font-size:12px;cursor:pointer;background:var(--card);color:var(--muted);font-family:'Sarabun',sans-serif;transition:all .15s}
.cat-fb.active{background:var(--forest);color:#fff;border-color:var(--forest)}
.cat-search{padding:6px 10px;border:1.5px solid var(--border);border-radius:var(--rsm);font-size:12px;font-family:'Sarabun',sans-serif;background:var(--card);color:var(--text);outline:none;width:180px}
.cat-search:focus{border-color:var(--forest)}
.cat-table{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.cat-head{display:grid;grid-template-columns:70px 1.8fr 110px 60px 72px 72px 1fr 72px;gap:4px;padding:6px 10px;background:var(--card2);border-bottom:1px solid var(--border);font-size:10px;font-weight:600;color:var(--hint);text-transform:uppercase;letter-spacing:.3px}
.cat-row{display:grid;grid-template-columns:70px 1.8fr 110px 60px 72px 72px 1fr 72px;gap:4px;padding:5px 10px;border-bottom:1px solid var(--border);align-items:start;font-size:12px}
.cat-row:last-child{border-bottom:none}
.cat-row:hover{background:var(--bg)}
.part-badge{font-size:10px;padding:2px 7px;border-radius:3px;font-weight:500}
.pb-pre{background:#EAF0EE;color:var(--forest)}
.pb-pro{background:var(--amber-bg);color:var(--amber)}
.pb-post{background:var(--blue-bg);color:var(--blue)}
.ci{padding:3px 6px;border:1px solid var(--border);border-radius:3px;font-size:12px;font-family:'Sarabun',sans-serif;background:var(--card);color:var(--text);outline:none;width:100%}
.ci.num{text-align:right}
.ci:focus{border-color:var(--forest)}

/* PRESET */
.preset-layout{display:grid;grid-template-columns:210px 1fr;flex:1;min-height:0}
.preset-main{display:flex;flex-direction:column;overflow-y:auto;padding:1rem;gap:.75rem}

/* MODAL */
.moverlay{position:fixed;inset:0;background:rgba(31,46,42,.55);display:none;align-items:center;justify-content:center;z-index:200;padding:1rem;backdrop-filter:blur(4px)}
.moverlay.open{display:flex}
.modal{background:var(--card);border-radius:14px;border:1px solid var(--border);padding:1.75rem;width:100%;max-width:540px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(17,19,17,.18)}
.modal h2{font-size:16px;font-weight:600;font-family:'IBM Plex Sans Thai',sans-serif;margin-bottom:1rem;color:var(--forest)}
.mf{margin-bottom:12px}
.mf label{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-bottom:4px;letter-spacing:.3px;text-transform:uppercase}
.mf input,.mf select,.mf textarea{width:100%;padding:8px 11px;border:1.5px solid var(--border);border-radius:var(--rsm);font-size:13px;font-family:'Sarabun',sans-serif;background:var(--card);color:var(--text);outline:none;transition:border-color .15s}
.mf input:focus,.mf select:focus,.mf textarea:focus{border-color:var(--forest)}
.mf textarea{resize:vertical;min-height:60px}
.mf-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mfooter{display:flex;justify-content:flex-end;gap:8px;margin-top:1rem;padding-top:.875rem;border-top:1px solid var(--border)}
.cp-list{max-height:220px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--rsm);margin-top:6px}
.cp-row{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--border);cursor:pointer;font-size:12px;transition:background .1s}
.cp-row:last-child{border-bottom:none}
.cp-row:hover{background:var(--bg)}
.cp-row.sel{background:#EAF0EE}
.empty{text-align:center;padding:3rem;color:var(--hint);font-size:13px}

/* CALCULATOR */
.calc-wrap{margin-top:auto;border-top:1px solid var(--border);padding-top:6px}
.calc-hd{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:600;color:var(--hint);text-transform:uppercase;letter-spacing:.4px;cursor:pointer;padding:3px 6px;border-radius:var(--rsm);user-select:none}
.calc-hd:hover{background:var(--bg);color:var(--text)}
.calc-body{display:none;padding:4px 0 2px}
.calc-body.open{display:block}
.calc-disp{background:var(--card2);border:1px solid var(--border);border-radius:var(--rsm);padding:5px 8px;text-align:right;font-size:14px;font-family:'IBM Plex Sans Thai',sans-serif;font-weight:600;color:var(--text);min-height:30px;margin-bottom:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.ck{padding:5px 2px;border-radius:4px;border:1px solid var(--border);font-size:12px;font-family:'Sarabun',sans-serif;background:var(--card);color:var(--text);cursor:pointer;text-align:center;transition:all .1s;line-height:1}
.ck:hover{background:var(--bg);border-color:var(--border2)}
.ck.op{background:var(--forest);color:#fff;border-color:var(--forest)}
.ck.op:hover{background:var(--dforest)}
.ck.eq{background:var(--gold);color:var(--brown);border-color:var(--gold);grid-column:span 2}
.ck.eq:hover{background:var(--gold2)}
.ck.clr{color:var(--red)}

/* PRINT */
@media print{
  .topbar,.sidebar,.sum-actions-left,.sum-actions-right,.it-actions,.add-row,.btn,
  .view-toggle,.qt-settings,.mgmt-cost,.sh-chev,.io-toggle,
  [data-noprint]{display:none!important}
  .qt-layout,.preset-layout{grid-template-columns:1fr!important}
  .qt-main,.preset-main{padding:.5rem!important}
  .sum-top{display:none!important}
  body{background:#fff!important;font-size:12px}
  .section-block{page-break-inside:avoid}
  @page{size:A4 portrait;margin:15mm 12mm}
  .g-int{grid-template-columns:1.8fr 1fr 50px 90px 75px!important}
  .it-cost-txt,.g-int .it-cell:nth-child(5),.g-int .it-cell:nth-child(7){display:none!important}
}
</style>
</head>
<body>
<div id="setup">
  <div class="scard">
    <div class="slogo"><div class="slogo-icon">📋</div>COT Quotation</div>
    <p class="ssub">ระบบออกใบเสนอราคา — ใช้ Supabase เดิมของ COT Follow ได้เลย</p>
    <div class="sf"><label>Supabase URL</label><input id="sb-url" placeholder="https://xxxx.supabase.co"/></div>
    <div class="sf"><label>Publishable Key</label><input id="sb-key" placeholder="sb_publishable_..."/></div>
    <div class="serr" id="serr"></div>
    <button class="sbtn" id="sbtn" onclick="connectDB()">เชื่อมต่อและเริ่มใช้งาน</button>
    <p class="snote">เบราว์เซอร์จะจำค่าให้ ไม่ต้องกรอกซ้ำ</p>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="tlogo"><div class="tlogo-dot"></div>COT Quotation</div>
    <div class="tnav">
      <button class="tnavbtn active" onclick="showPage('qt',this)">ใบเสนอราคา</button>
      <button class="tnavbtn" onclick="showPage('cat',this)">Catalogue</button>
      <button class="tnavbtn" onclick="showPage('preset',this)">Preset</button>
    </div>
    <div class="tright">
      <button class="theme-toggle" onclick="toggleTheme()" title="สลับ Dark/Light">🌙</button>
      <span class="sdot" id="sdot"></span>
      <button class="topbtn gold" onclick="createNewQT()">+ ใบใหม่</button>
    </div>
  </div>

  <div class="page active" id="page-qt">
    <div class="qt-layout">
      <div class="sidebar" id="sb-qt">
        <div class="sb-label">โปรเจค</div>
        <div id="proj-list"></div>
        <button class="dashed-btn" onclick="openNewProj()">+ โปรเจคใหม่</button>
        <div style="display:flex;align-items:center;cursor:pointer;padding:4px 6px;border-radius:var(--rsm);margin-top:2px" onclick="toggleArchiveSection()" title="โปรเจคที่ archive">
          <span style="font-size:10px;font-weight:600;color:var(--hint);text-transform:uppercase;letter-spacing:.4px;flex:1">📁 Archived</span>
          <span id="arch-chev" style="font-size:9px;color:var(--hint)">▶</span>
        </div>
        <div id="arch-list" style="display:none"></div>
        <div class="sb-divider"></div>
        <div class="sb-label" id="ver-label" style="display:none">Versions</div>
        <div id="ver-list"></div>
        <button class="dashed-btn" id="new-ver-btn" style="display:none" onclick="cloneQT()">+ Version ใหม่</button>
        <div class="calc-wrap">
          <div class="calc-hd" onclick="toggleCalc()"><span>🧮</span><span style="flex:1">Calculator</span><span id="calc-chev">▶</span></div>
          <div class="calc-body" id="calc-body">
            <div class="calc-disp" id="calc-disp">0</div>
            <div class="calc-grid">
              <button class="ck clr" onclick="calcBtn('C')">C</button>
              <button class="ck" onclick="calcBtn('±')">±</button>
              <button class="ck" onclick="calcBtn('%')">%</button>
              <button class="ck op" onclick="calcBtn('÷')">÷</button>
              <button class="ck" onclick="calcBtn('7')">7</button>
              <button class="ck" onclick="calcBtn('8')">8</button>
              <button class="ck" onclick="calcBtn('9')">9</button>
              <button class="ck op" onclick="calcBtn('×')">×</button>
              <button class="ck" onclick="calcBtn('4')">4</button>
              <button class="ck" onclick="calcBtn('5')">5</button>
              <button class="ck" onclick="calcBtn('6')">6</button>
              <button class="ck op" onclick="calcBtn('-')">−</button>
              <button class="ck" onclick="calcBtn('1')">1</button>
              <button class="ck" onclick="calcBtn('2')">2</button>
              <button class="ck" onclick="calcBtn('3')">3</button>
              <button class="ck op" onclick="calcBtn('+')">+</button>
              <button class="ck" onclick="calcBtn('0')">0</button>
              <button class="ck" onclick="calcBtn('.')">.</button>
              <button class="ck eq" onclick="calcBtn('=')">=</button>
            </div>
          </div>
        </div>
      </div>
      <div class="qt-main" id="qt-main">
        <div class="empty" style="margin:auto;padding:4rem">เลือกโปรเจคหรือกด "+ ใบใหม่" ครับ</div>
      </div>
    </div>
  </div>

  <div class="page" id="page-cat">
    <div class="cat-page">
      <div class="cat-toolbar">
        <div style="display:flex;gap:4px">
          <button class="cat-fb active" onclick="filterCat('all',this)">ทั้งหมด</button>
          <button class="cat-fb" onclick="filterCat('Pre-Production',this)">Pre</button>
          <button class="cat-fb" onclick="filterCat('Production',this)">Pro</button>
          <button class="cat-fb" onclick="filterCat('Post-Production',this)">Post</button>
        </div>
        <input class="cat-search" id="cat-q" placeholder="ค้นหา..." oninput="renderCat()"/>
        <button class="btn" style="margin-left:auto" onclick="importDefaultCatalogue()" title="นำเข้า 119 รายการ Default จาก COT Template">📥 Import Default</button>
        <button class="btn primary" onclick="openAddCat()">+ เพิ่มรายการ</button>
      </div>
      <div id="cat-wrap"></div>
    </div>
  </div>

  <div class="page" id="page-preset">
    <div class="preset-layout">
      <div class="sidebar" id="sb-preset">
        <div class="sb-label">Preset Packages</div>
        <div id="preset-sb-list"></div>
        <button class="dashed-btn" onclick="openAddPreset()">+ สร้าง Preset</button>
      </div>
      <div class="preset-main" id="preset-main">
        <div class="empty" style="margin:auto;padding:4rem">เลือก Preset ทางซ้ายหรือสร้างใหม่ครับ</div>
      </div>
    </div>
  </div>
</div>

<div class="moverlay" id="moverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<script>
let SB_URL='',SB_KEY='';
let projects=[],quotations=[],qItems=[],catalogue=[],presets=[],presetItems=[];
let activeProjId=null,activeQTId=null,activePresetId=null;
let currentView='internal',catFilter='all',isDark=false;

const H=()=>({'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'});
const fmt=n=>Math.round(n||0).toLocaleString('th-TH');
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const today=()=>new Date().toISOString().split('T')[0];
const genNo=()=>'QT'+new Date().getFullYear()+(new Date().getMonth()+1).toString().padStart(2,'0')+Math.floor(Math.random()*9000+1000);

function toggleTheme(){
  isDark=!isDark;
  document.documentElement.setAttribute('data-theme',isDark?'dark':'');
  document.querySelector('.theme-toggle').textContent=isDark?'☀️':'🌙';
  localStorage.setItem('qt_dark',isDark?'1':'');
}

async function safeGet(path){
  try{const r=await fetch(SB_URL+'/rest/v1/'+path,{headers:H()});
  if(!r.ok)return [];const d=await r.json();return Array.isArray(d)?d:[];}
  catch(e){return [];}
}
async function dbPost(table,data){
  try{
    const r=await fetch(SB_URL+'/rest/v1/'+table,{method:'POST',headers:{...H(),'Prefer':'return=representation'},body:JSON.stringify(data)});
    if(!r.ok){const e=await r.text();console.error('POST',table,'failed:',e);return null;}
    const j=await r.json();return Array.isArray(j)?j[0]:j;
  }catch(e){console.error('POST',table,'error:',e);return null;}
}
async function dbPatch(table,filter,data){
  await fetch(SB_URL+'/rest/v1/'+table+'?'+filter,{method:'PATCH',headers:{...H(),'Prefer':'return=minimal'},body:JSON.stringify(data)});
}
async function dbDelete(table,filter){
  await fetch(SB_URL+'/rest/v1/'+table+'?'+filter,{method:'DELETE',headers:H()});
}

async function connectDB(){
  const url=document.getElementById('sb-url').value.trim();
  const key=document.getElementById('sb-key').value.trim();
  const err=document.getElementById('serr'),btn=document.getElementById('sbtn');
  if(!url||!key){err.style.display='block';err.textContent='กรุณากรอก URL และ Key';return;}
  btn.innerHTML='<span class="spinner"></span> กำลังเชื่อมต่อ...';btn.disabled=true;err.style.display='none';
  SB_URL=url.replace(/\/$/,'');SB_KEY=key;
  try{
    const r=await fetch(SB_URL+'/rest/v1/qt_projects?select=id&limit=1&order=created_at.asc',{headers:H()});
    if(!r.ok)throw new Error('HTTP '+r.status+': '+await r.text());
    localStorage.setItem('qt_url',url);localStorage.setItem('qt_key',key);
    document.getElementById('setup').style.display='none';
    document.getElementById('app').style.display='flex';
    setSyncDot(true);await loadAll();setInterval(loadAll,20000);
  }catch(e){
    err.style.display='block';err.textContent='เชื่อมต่อไม่ได้: '+e.message;
    btn.innerHTML='เชื่อมต่อและเริ่มใช้งาน';btn.disabled=false;
  }
}
function setSyncDot(ok){document.getElementById('sdot').className='sdot '+(ok?'ok':'err');}

async function loadAll(){
  try{
    const [pr,qt,it,cat,ps,psi]=await Promise.all([
      safeGet('qt_projects?select=*&order=created_at.asc'),
      safeGet('qt_quotations?select=*&order=created_at.asc'),
      safeGet('qt_items?select=*&order=created_at.asc'),
      safeGet('qt_catalogue?select=*&order=name.asc'),
      safeGet('qt_presets?select=*&order=name.asc'),
      safeGet('qt_preset_items?select=*&order=created_at.asc')
    ]);
    projects=pr;quotations=qt;qItems=it;catalogue=cat;presets=ps;presetItems=psi;
    setSyncDot(true);
    renderSidebar();renderPresetSidebar();
    if(activeQTId)renderQT();
    if(activePresetId)renderPreset();
    renderCat();
  }catch(e){setSyncDot(false);}
}

function showPage(p,el){
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tnavbtn').forEach(x=>x.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  if(el)el.classList.add('active');
  else document.querySelector('.tnavbtn').classList.add('active');
}

/* SIDEBAR */
function renderSidebar(){
  document.getElementById('proj-list').innerHTML=projects.filter(p=>!p.archived).map(p=>{
    const cnt=quotations.filter(q=>q.project_id===p.id).length;
    return `<div class="sb-item ${activeProjId===p.id?'active':''}" onclick="selectProj('${p.id}')">
      <div class="sb-dot"></div>
      <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</span>
      <span class="sb-meta">${cnt}v</span>
      <button onclick="event.stopPropagation();archiveProj('${p.id}')" style="background:transparent;border:none;cursor:pointer;color:var(--hint);padding:0 2px;font-size:11px;opacity:.5;line-height:1" title="Archive โปรเจค">⊖</button>
    </div>`;
  }).join('')||'<div style="font-size:11px;color:var(--hint);padding:6px 8px">ยังไม่มีโปรเจค</div>';

  const archived=projects.filter(p=>p.archived);
  const archList=document.getElementById('arch-list');
  if(archList){
    archList.innerHTML=archived.map(p=>`
      <div class="sb-item" style="opacity:.65">
        <span style="font-size:10px">📁</span>
        <span style="flex:1;font-size:11px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</span>
        <div style="display:flex;gap:3px">
          <button onclick="restoreProj('${p.id}')" style="background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd);border-radius:3px;cursor:pointer;font-size:10px;padding:1px 6px;font-family:'Sarabun',sans-serif" title="คืนค่าโปรเจค">↩</button>
          <button onclick="delProjPermanent('${p.id}')" style="background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd);border-radius:3px;cursor:pointer;font-size:10px;padding:1px 6px;font-family:'Sarabun',sans-serif" title="ลบถาวร">🗑</button>
        </div>
      </div>`).join('')||'';
  }

  const vl=document.getElementById('ver-list');
  const vLabel=document.getElementById('ver-label');
  const nvBtn=document.getElementById('new-ver-btn');
  if(activeProjId){
    const proj=projects.find(p=>p.id===activeProjId);
    vLabel.style.display='block';vLabel.textContent=proj?.name||'Versions';nvBtn.style.display='block';
    const statusStyle=s=>s==='final'?'background:#EAF5EE;color:var(--green)':s==='sent'?'background:var(--blue-bg);color:var(--blue)':'background:var(--card2);color:var(--hint)';
    vl.innerHTML=quotations.filter(q=>q.project_id===activeProjId).map(q=>`
      <div class="sb-item ${activeQTId===q.id?'active':''}" onclick="selectQT('${q.id}')">
        <span style="font-size:11px">📄</span>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap">
            <span>${q.version_name}</span>
            <span style="font-size:9px;padding:1px 5px;border-radius:3px;font-weight:600;${statusStyle(q.status)}">${q.status||'draft'}</span>
          </div>
          ${q.version_note?`<div class="sb-note">${q.version_note.substring(0,24)}</div>`:''}
        </div>
      </div>`).join('')||'<div style="font-size:11px;color:var(--hint);padding:6px 8px">ยังไม่มีใบ</div>';
  }else{vLabel.style.display='none';nvBtn.style.display='none';vl.innerHTML='';}
}

function selectProj(id){
  activeProjId=id;
  const qts=quotations.filter(q=>q.project_id===id);
  if(qts.length)selectQT(qts[qts.length-1].id);
  else{activeQTId=null;document.getElementById('qt-main').innerHTML='<div class="empty" style="margin:auto;padding:4rem">กด "+ Version ใหม่" ครับ</div>';}
  renderSidebar();
}
function selectQT(id){activeQTId=id;renderSidebar();renderQT();}

async function createNewQT(){
  showPage('qt',null);
  if(!activeProjId){await openNewProj();return;}
  const vNum=quotations.filter(q=>q.project_id===activeProjId).length+1;
  const last=quotations.filter(q=>q.project_id===activeProjId).pop();
  const qt=await dbPost('qt_quotations',{project_id:activeProjId,version_name:'v'+vNum,qt_number:genNo(),qt_date:today(),client_name:last?.client_name||'',markup_default:last?.markup_default||15,mgmt_fee_pct:last?.mgmt_fee_pct||10,vat_enabled:true,wht_enabled:true,show_extra:false,status:'draft'});
  if(qt){activeQTId=qt.id;quotations.push(qt);}
  renderSidebar();renderQT();
}

async function cloneQT(){
  if(!activeQTId){await createNewQT();return;}
  const qt=quotations.find(q=>q.id===activeQTId);if(!qt)return;
  const vNum=quotations.filter(q=>q.project_id===qt.project_id).length+1;
  const {id:_,created_at:__,...d}=qt;
  const newQT=await dbPost('qt_quotations',{...d,version_name:'v'+vNum,qt_number:genNo(),status:'draft',version_note:''});
  if(newQT){
    const its=qItems.filter(i=>i.quotation_id===activeQTId);
    for(const i of its){const {id:_i,created_at:_c,...id2}=i;const ni=await dbPost('qt_items',{...id2,quotation_id:newQT.id});if(ni)qItems.push(ni);}
    activeQTId=newQT.id;quotations.push(newQT);
  }
  renderSidebar();renderQT();
}

/* RENDER QT */
function renderQT(){
  const qt=quotations.find(q=>q.id===activeQTId);
  if(!qt){document.getElementById('qt-main').innerHTML='<div class="empty" style="margin:auto">ไม่พบใบเสนอราคา</div>';return;}
  const proj=projects.find(p=>p.id===qt.project_id);
  const isInt=currentView==='internal';
  const gc=isInt?'g-int':'g-cli';

  const calcSec=(sec)=>{
    const si=qItems.filter(i=>i.quotation_id===activeQTId&&i.section===sec&&!i.is_extra);
    // COT items: price counts as full profit (cost=0 for profit calc)
    const cost=si.reduce((a,i)=>a+(i.is_cot?0:i.cost*i.qty),0);
    const price=si.reduce((a,i)=>a+(i.price*i.qty),0);
    return {cost,price};
  };
  const calcExt=()=>{
    const si=qItems.filter(i=>i.quotation_id===activeQTId&&i.is_extra);
    const cost=si.reduce((a,i)=>a+(i.is_cot?0:i.cost*i.qty),0);
    const price=si.reduce((a,i)=>a+(i.price*i.qty),0);
    return {cost,price};
  };
  const pre=calcSec('Pre-Production'),pro=calcSec('Production'),post=calcSec('Post-Production'),ext=calcExt();
  const sub=pre.price+pro.price+post.price+(qt.show_extra?ext.price:0);
  const mgmt=sub*(qt.mgmt_fee_pct/100);
  const beforeVat=sub+mgmt;
  const vat=qt.vat_enabled?beforeVat*.07:0;
  const wht=qt.wht_enabled?beforeVat*.03:0;
  const totalCost=pre.cost+pro.cost+post.cost+(qt.show_extra?ext.cost:0);
  const profit=beforeVat-totalCost;
  const margin=beforeVat>0?((profit/beforeVat)*100).toFixed(1):0;

  const renderHead=()=>isInt
    ?`<div class="it-head g-int"><div>ตำแหน่ง / ชนิด</div><div>ชื่อ / รุ่น</div><div style="text-align:right">จน.</div><div style="text-align:right">ต้นทุน</div><div style="text-align:right">ราคาขาย</div><div style="text-align:center">MK%</div><div style="text-align:right">รวม</div><div></div></div>`
    :`<div class="it-head g-cli"><div>ตำแหน่ง / รายการ</div><div>ชื่อ / รุ่น</div><div style="text-align:right">จน.</div><div style="text-align:right">ราคา/unit</div><div style="text-align:right">รวม</div></div>`;

  const renderItem=(item)=>{
    const tot=(item.price||0)*(item.qty||1);
    const isOwn=item.is_cot;
    const isP=(item.io_type||'person')==='person';
    if(isInt) return `<div class="it-row g-int${isOwn?' cot-row':''}">
      <div style="display:flex;flex-direction:column;gap:1px;min-width:0">
        <input class="ie" value="${esc(item.item_role)}" placeholder="${isP?'ตำแหน่ง *':'ชนิด *'}" onblur="patchItemLocal('${item.id}','item_role',this.value)" style="font-weight:600;font-size:12px"/>
        <input class="ie sm-txt" value="${esc(item.name)}" placeholder="คำอธิบายเพิ่มเติม..." onblur="patchItemLocal('${item.id}','name',this.value)"/>
      </div>
      <input class="ie" value="${esc(item.item_person)}" placeholder="${isP?'ชื่อ':'รุ่น/Model'}" onblur="patchItemLocal('${item.id}','item_person',this.value)" style="font-size:12px"/>
      <input class="ie num" value="${item.qty||1}" onblur="patchItemNum('${item.id}','qty',this.value)" style="width:100%"/>
      <input class="ie num" value="${item.cost||0}" onblur="patchItemNum('${item.id}','cost',this.value)" style="color:var(--amber);${isOwn?'text-decoration:line-through;opacity:.6':''}" title="${isOwn?'COT: ต้นทุนไม่นับในกำไร แต่ยังใช้คำนวณ MK ได้':''}"/>
      <input class="ie num" value="${item.price||0}" onblur="patchItemNum('${item.id}','price',this.value)"/>
      <input class="ie mk" value="${item.markup_pct||''}" placeholder="0" onblur="applyMk('${item.id}',+this.value)"/>
      <div class="it-total-txt">${fmt(tot)}</div>
      <div class="it-actions">
        <button class="btn ghost sm" onclick="openEditItem('${item.id}')" title="แก้ไข" style="padding:2px 5px">✏</button>
        <button class="btn ghost sm" onclick="addItemToCat('${item.id}')" title="บันทึกลง Catalogue" style="padding:2px 5px;font-size:11px">+C</button>
        <button class="btn ghost sm" onclick="toggleItemType('${item.id}','${isP?'item':'person'}')" title="${isP?'บุคคล':'สินค้า'}" style="font-size:11px;padding:2px 4px">${isP?'👤':'📦'}</button>
        <button class="btn ${isOwn?'purple':'ghost'} sm" onclick="toggleCot('${item.id}',${isOwn})" title="${isOwn?'COT ON':'COT OFF'}" style="padding:2px 5px">C</button>
        <button class="btn danger sm" onclick="delItem('${item.id}')" style="padding:2px 5px">✕</button>
      </div>
    </div>`;
    return `<div class="it-row g-cli">
      <div>
        <span style="font-weight:600">${esc(item.item_role)||esc(item.name)||'-'}</span>
        ${item.name&&item.item_role?`<span style="font-size:11px;color:var(--muted)"> · ${esc(item.name)}</span>`:''}
        ${item.detail?`<span style="font-size:11px;color:var(--muted)"> ${esc(item.detail)}</span>`:''}
      </div>
      <div>${esc(item.item_person)}</div>
      <div style="text-align:right">${item.qty||1}${item.unit?' '+item.unit:''}</div>
      <div style="text-align:right">${fmt(item.price)}</div>
      <div class="it-total-txt">${fmt(tot)}</div>
    </div>`;
  };

  const renderSec=(sec,label,cls)=>{
    const data=sec==='Pre-Production'?pre:sec==='Production'?pro:post;
    const si=qItems.filter(i=>i.quotation_id===activeQTId&&i.section===sec&&!i.is_extra);
    return `<div class="section-block">
      <div class="section-head ${cls}" onclick="togSec('${sec}')">
        <div class="sh-title">${label}</div>
        <div class="sh-total">฿ ${fmt(data.price)}</div>
        ${isInt?`<div class="sh-cost">ต้นทุน ${fmt(data.cost)}</div>`:''}
        <span class="sh-chev open" id="chev-${sec}">▼</span>
      </div>

function togSec(sec){
  const b=document.getElementById('sec-'+sec);const c=document.getElementById('chev-'+sec);
  if(!b)return;b.style.display=b.style.display==='none'?'':'none';
  if(c)c.classList.toggle('open',b.style.display!=='none');
}
function setView(v){currentView=v;renderQT();}

async function saveQF(f,v){
  if(!activeQTId)return;
  await dbPatch('qt_quotations','id=eq.'+activeQTId,{[f]:v});
  quotations=quotations.map(q=>q.id===activeQTId?{...q,[f]:v}:q);
  if(['show_extra','vat_enabled','wht_enabled','mgmt_fee_pct','markup_default'].includes(f))renderQT();
  else renderSidebar();
}
async function saveProjName(v){
  if(!activeProjId||!v.trim())return;
  await dbPatch('qt_projects','id=eq.'+activeProjId,{name:v.trim()});
  projects=projects.map(p=>p.id===activeProjId?{...p,name:v.trim()}:p);renderSidebar();
}

async function patchItemLocal(id,f,v){
  await dbPatch('qt_items','id=eq.'+id,{[f]:v});
  qItems=qItems.map(i=>i.id===id?{...i,[f]:v}:i);
}
async function patchItemNum(id,f,v){
  const n=Number(v)||0;
  await dbPatch('qt_items','id=eq.'+id,{[f]:n});
  qItems=qItems.map(i=>i.id===id?{...i,[f]:n}:i);
  renderQT();
}
async function applyMk(id,pct){
  const item=qItems.find(i=>i.id===id);if(!item)return;
  const price=pct>0&&item.cost>0?Math.round(item.cost*(1+pct/100)):item.price;
  await dbPatch('qt_items','id=eq.'+id,{markup_pct:pct,price});
  qItems=qItems.map(i=>i.id===id?{...i,markup_pct:pct,price}:i);renderQT();
}
async function toggleCot(id,wasCot){
  await dbPatch('qt_items','id=eq.'+id,{is_cot:!wasCot});
  qItems=qItems.map(i=>i.id===id?{...i,is_cot:!wasCot}:i);renderQT();
}
async function toggleItemType(id,newType){
  await dbPatch('qt_items','id=eq.'+id,{io_type:newType});
  qItems=qItems.map(i=>i.id===id?{...i,io_type:newType}:i);renderQT();
}
async function setIO(id,type,btn){
  await dbPatch('qt_items','id=eq.'+id,{io_type:type});
  qItems=qItems.map(i=>i.id===id?{...i,io_type:type}:i);
  const wrap=btn.closest('.io-toggle');
  wrap.querySelectorAll('.io-opt').forEach(b=>{b.classList.remove('active-in','active-out');});
  btn.classList.add(type==='inhouse'?'active-in':'active-out');
}
async function delItem(id){
  await dbDelete('qt_items','id=eq.'+id);
  qItems=qItems.filter(i=>i.id!==id);renderQT();
}

async function saveAddItemAndCat(section,isExtra){
  const role=document.getElementById('ai-role').value.trim();
  const name=document.getElementById('ai-name').value.trim();
  if(!role)return alert('กรุณาระบุตำแหน่ง/ชนิด');
  const cost=+document.getElementById('ai-cost').value||0;
  const cat=await dbPost('qt_catalogue',{
    name:role+(name?' — '+name:''),
    part:isExtra?'Pre-Production':section,
    unit:document.getElementById('ai-unit').value||'',
    item_role:role,
    item_person:document.getElementById('ai-person')?.value||'',
    cost_min:cost,cost_max:cost,
    notes:document.getElementById('ai-detail').value||''
  });
  if(cat)catalogue.push(cat);
  await saveAddItem(section,isExtra);
}

function filterCP(q,sec,isExtra){
  const ql=q.toLowerCase();
  const cats=(isExtra?catalogue:catalogue.filter(c=>c.part===sec)).filter(c=>
    (c.item_role||'').toLowerCase().includes(ql)||
    (c.item_person||'').toLowerCase().includes(ql)||
    (c.name||'').toLowerCase().includes(ql));
  document.getElementById('cp-list').innerHTML=cats.map(c=>`<div class="cp-row" onclick="fillCat('${c.id}')">
    <div style="flex:1;min-width:0">
      <div style="font-weight:600;font-size:12px">${esc(c.item_role)||esc(c.name)||'-'}</div>
      ${c.item_person?`<div style="font-size:11px;color:var(--muted)">${esc(c.item_person)}</div>`:''}
    </div>
    <span style="font-size:11px;color:var(--muted);white-space:nowrap">${fmt(c.cost_min)} / ${c.unit||'-'}</span>
  </div>`).join('')||'<div class="empty" style="padding:1rem;font-size:12px">ไม่พบ</div>';
}
function fillCat(id){
  const c=catalogue.find(x=>x.id===id);if(!c)return;
  document.getElementById('ai-role').value=c.item_role||'';
  document.getElementById('ai-person').value=c.item_person||'';
  /* name field = description only (strip "role — " prefix if present) */
  const desc=(c.name||'').replace(new RegExp('^'+c.item_role.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*—\\s*'),'');
  document.getElementById('ai-name').value=c.item_role===c.name?'':desc;
  document.getElementById('ai-detail').value=c.notes||'';
  document.getElementById('ai-unit').value=c.unit||'';
  document.getElementById('ai-cost').value=c.cost_min;
  calcMkP();
  document.querySelectorAll('.cp-row').forEach(r=>r.classList.remove('sel'));
  event.currentTarget.classList.add('sel');
}
function calcMkP(){
  const cost=+document.getElementById('ai-cost')?.value||0;
  const mk=+document.getElementById('ai-mk')?.value||0;
  if(mk>0&&cost>0)document.getElementById('ai-price').value=Math.round(cost*(1+mk/100));
}
async function saveAddItem(section,isExtra){
  const role=document.getElementById('ai-role').value.trim();
  const name=document.getElementById('ai-name').value.trim();
  if(!role)return alert('กรุณาระบุตำแหน่ง/ชนิด');
  const cost=+document.getElementById('ai-cost').value||0;
  const mk=+document.getElementById('ai-mk').value||0;
  let price=+document.getElementById('ai-price').value||0;
  if(mk>0&&cost>0&&price===0)price=Math.round(cost*(1+mk/100));
  const item=await dbPost('qt_items',{
    quotation_id:activeQTId,section:isExtra?'Extra':section,
    item_role:document.getElementById('ai-role').value,
    item_person:document.getElementById('ai-person').value,
    name,detail:document.getElementById('ai-detail').value,
    unit:document.getElementById('ai-unit').value,
    qty:+document.getElementById('ai-qty').value||1,
    cost,price,markup_pct:mk,

    is_extra:isExtra,is_cot:false,io_type:'person'
  });
  if(item)qItems.push(item);closeModal();renderQT();
}

async function delQT(){

  await dbDelete('qt_items','quotation_id=eq.'+activeQTId);

async function saveAsPreset(){
  const qt=quotations.find(q=>q.id===activeQTId);
  openModal(`<h2>⭐ บันทึกเป็น Preset</h2>
    <div class="mf"><label>ชื่อ Preset *</label><input id="prn" value="${qt?.version_name||''}"/></div>
    <div class="mf"><label>คำอธิบาย</label><input id="prd" placeholder="รายละเอียด..."/></div>
    <div class="mfooter"><button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn primary" onclick="doSaveAsPreset()">บันทึก</button></div>`);
}
async function doSaveAsPreset(){
  const name=document.getElementById('prn').value.trim();if(!name)return;
  const ps=await dbPost('qt_presets',{name,description:document.getElementById('prd').value});
  if(!ps){alert('บันทึก Preset ไม่สำเร็จ ลองใหม่อีกครั้ง');return;}
  const its=qItems.filter(i=>i.quotation_id===activeQTId);
  let ok=0,fail=0;
  for(const i of its){
    /* map 'Extra' section → nearest standard section */
    const sec=['Pre-Production','Production','Post-Production'].includes(i.section)?i.section:'Pre-Production';
    const pi=await dbPost('qt_preset_items',{
      preset_id:ps.id,
      section:sec,
      name:i.name||'',
      item_role:i.item_role||'',
      item_person:i.item_person||'',
      detail:i.detail||'',
      unit:i.unit||'',
      qty:i.qty||1,
      cost:i.cost||0,
      price:i.price||0,
      markup_pct:i.markup_pct||0
    });
    if(pi){presetItems.push(pi);ok++;}else fail++;
  }
  presets.push(ps);activePresetId=ps.id;
  closeModal();renderPresetSidebar();
  showPage('preset',document.querySelectorAll('.tnavbtn')[2]);
  renderPreset();
  if(fail>0)setTimeout(()=>alert(`คัดลอกสำเร็จ ${ok} รายการ — ล้มเหลว ${fail} รายการ (ดู console สำหรับรายละเอียด)`),300);
}

/* CATALOGUE */
function catFocus(el){el.value=el.dataset.raw||'0';}
async function catBlur(el){
  const raw=el.value.replace(/,/g,'');
  const n=Number(raw)||0;
  el.dataset.raw=n;
  el.value=fmt(n);
  await patchCat(el.dataset.id,el.dataset.field,n);
}
function renderCat(){
  const q=(document.getElementById('cat-q')?.value||'').toLowerCase();
  let list=catalogue.filter(c=>catFilter==='all'||c.part===catFilter);
  if(q)list=list.filter(c=>
    (c.item_role||'').toLowerCase().includes(q)||
    (c.item_person||'').toLowerCase().includes(q)||
    (c.name||'').toLowerCase().includes(q)||
    (c.notes||'').toLowerCase().includes(q));
  const wrap=document.getElementById('cat-wrap');if(!wrap)return;
  if(!list.length){wrap.innerHTML='<div class="empty">ไม่มีรายการ</div>';return;}

function filterPICP(q,sec){
  const ql=q.toLowerCase();
  const cats=catalogue.filter(c=>c.part===sec&&(
    (c.item_role||'').toLowerCase().includes(ql)||
    (c.item_person||'').toLowerCase().includes(ql)||
    (c.name||'').toLowerCase().includes(ql)));
  document.getElementById('cp-list').innerHTML=cats.map(c=>`<div class="cp-row" onclick="fillCatPI('${c.id}')">
    <div style="flex:1;min-width:0">
      <div style="font-weight:600;font-size:12px">${esc(c.item_role)||esc(c.name)||'-'}</div>
      ${c.item_person?`<div style="font-size:11px;color:var(--muted)">${esc(c.item_person)}</div>`:''}
    </div>
    <span style="font-size:11px;color:var(--muted);white-space:nowrap">${fmt(c.cost_min)} / ${c.unit||'-'}</span>
  </div>`).join('')||'<div class="empty" style="padding:1rem;font-size:12px">ไม่พบ</div>';
}
function fillCatPI(id){
  const c=catalogue.find(x=>x.id===id);if(!c)return;
  document.getElementById('pi-role').value=c.item_role||'';
  document.getElementById('pi-person').value=c.item_person||'';
  const desc=(c.name||'').replace(new RegExp('^'+c.item_role.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*—\\s*'),'');
  document.getElementById('pi-name').value=c.item_role===c.name?'':desc;
  document.getElementById('pi-unit').value=c.unit||'';
  document.getElementById('pi-cost').value=c.cost_min;
  document.querySelectorAll('.cp-row').forEach(r=>r.classList.remove('sel'));
  event.currentTarget.classList.add('sel');
}

async function applyPreset(pid){
  if(!activeQTId){alert('กรุณาเลือกใบ QT ก่อนครับ');showPage('qt',null);return;}
  if(!confirm('เพิ่มรายการจาก Preset นี้ใส่ใบปัจจุบัน?'))return;
  const pis=presetItems.filter(i=>i.preset_id===pid);
  for(const i of pis){
    const ni=await dbPost('qt_items',{
      quotation_id:activeQTId,
      section:['Pre-Production','Production','Post-Production'].includes(i.section)?i.section:'Pre-Production',
      item_role:i.item_role||'',
      item_person:i.item_person||'',
      name:i.name||'',
      detail:i.detail||'',
      unit:i.unit||'',
      qty:i.qty||1,
      cost:i.cost||0,
      price:i.price||0,
      markup_pct:i.markup_pct||0,
      is_extra:false,
      is_cot:false,
      io_type:'person'
    });
    if(ni)qItems.push(ni);
  }
  showPage('qt',document.querySelector('.tnavbtn'));renderQT();
}

/* PROJECT ARCHIVE */
async function archiveProj(id){
  if(!confirm('Archive โปรเจคนี้? (ซ่อนชั่วคราว ข้อมูลยังอยู่ครบ)'))return;
  await dbPatch('qt_projects','id=eq.'+id,{archived:true});
  projects=projects.map(p=>p.id===id?{...p,archived:true}:p);
  if(activeProjId===id){
    activeProjId=null;activeQTId=null;
    document.getElementById('qt-main').innerHTML='<div class="empty" style="margin:auto;padding:4rem">เลือกโปรเจคหรือกด "+ ใบใหม่" ครับ</div>';
  }
  renderSidebar();
}
async function restoreProj(id){
  await dbPatch('qt_projects','id=eq.'+id,{archived:false});
  projects=projects.map(p=>p.id===id?{...p,archived:false}:p);
  renderSidebar();
}
async function delProjPermanent(id){
  const p=projects.find(x=>x.id===id);
  if(!confirm(`ลบโปรเจค "${p?.name}" ถาวร? ข้อมูลทั้งหมดจะหายหมด`))return;
  /* delete all items → quotations → project */
  const qts=quotations.filter(q=>q.project_id===id);
  for(const q of qts){
    await dbDelete('qt_items','quotation_id=eq.'+q.id);
    qItems=qItems.filter(i=>i.quotation_id!==q.id);
  }
  await dbDelete('qt_quotations','project_id=eq.'+id);
  quotations=quotations.filter(q=>q.project_id!==id);
  await dbDelete('qt_projects','id=eq.'+id);
  projects=projects.filter(x=>x.id!==id);
  if(activeProjId===id){activeProjId=null;activeQTId=null;
    document.getElementById('qt-main').innerHTML='<div class="empty" style="margin:auto;padding:4rem">เลือกโปรเจคครับ</div>';}
  renderSidebar();
}

async function addItemToCat(id){
  const item=qItems.find(i=>i.id===id);if(!item)return;
  const role=item.item_role||item.name||'';
  if(!role){alert('ไม่มีชื่อตำแหน่ง/ชนิด');return;}
  const sec=['Pre-Production','Production','Post-Production'].includes(item.section)?item.section:'Pre-Production';
  const c=await dbPost('qt_catalogue',{
    name:role+(item.name&&item.item_role?' — '+item.name:''),
    item_role:item.item_role||'',
    item_person:item.item_person||'',
    part:sec,
    unit:item.unit||'',
    cost_min:item.cost||0,
    cost_max:item.cost||0,
    notes:item.detail||item.name||''
  });
  if(c){catalogue.push(c);alert('เพิ่มลง Catalogue แล้วครับ ✓');}
  else alert('บันทึกไม่สำเร็จ ลองใหม่');

/* CALCULATOR */
let _cVal='0',_cOp=null,_cPrev=null,_cNew=true;
function toggleCalc(){
  const b=document.getElementById('calc-body'),c=document.getElementById('calc-chev');
  const open=!b.classList.contains('open');
  b.classList.toggle('open',open);
  if(c)c.textContent=open?'▼':'▶';
}
function calcBtn(v){
  const disp=document.getElementById('calc-disp');
  if(v==='C'){_cVal='0';_cOp=null;_cPrev=null;_cNew=true;}
  else if(v==='±'){_cVal=String(-parseFloat(_cVal)||0);}
  else if(v==='%'){_cVal=String(parseFloat(_cVal)/100);}
  else if(['+','-','×','÷'].includes(v)){_cPrev=parseFloat(_cVal);_cOp=v;_cNew=true;}
  else if(v==='='){
    if(_cOp&&_cPrev!==null){
      const n=parseFloat(_cVal);
      let r=_cOp==='+'?_cPrev+n:_cOp==='-'?_cPrev-n:_cOp==='×'?_cPrev*n:n!==0?_cPrev/n:0;
      _cVal=String(Math.round(r*1e8)/1e8);
      _cOp=null;_cPrev=null;_cNew=true;
    }
  }else if(v==='.'){
    if(_cNew){_cVal='0.';_cNew=false;}
    else if(!_cVal.includes('.'))_cVal+='.';
  }else{
    if(_cNew||_cVal==='0'){_cVal=v;_cNew=false;}
    else{if(_cVal.length<12)_cVal+=v;}
  }
  const num=parseFloat(_cVal);
  disp.textContent=isNaN(num)?_cVal:_cVal.endsWith('.')?_cVal:_cVal.includes('.')?_cVal:num.toLocaleString('th-TH');
}

window.onload=function(){
  if(localStorage.getItem('qt_dark')==='1'){isDark=true;document.documentElement.setAttribute('data-theme','dark');document.querySelector('.theme-toggle').textContent='☀️';}
  const url=localStorage.getItem('qt_url'),key=localStorage.getItem('qt_key');
  if(url&&key){
    document.getElementById('sb-url').value=url;document.getElementById('sb-key').value=key;
    SB_URL=url.replace(/\/$/,'');SB_KEY=key;connectDB();
  }
};
